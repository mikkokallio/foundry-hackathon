[tool.pytest.ini_options]
testpaths = ["scenarios/architecture-docs/tests"]
pythonpath = [
  "scenarios/architecture-docs/backend/src",
  "scenarios/architecture-docs/toolkit-mcp",
]

[tool.pyright]
extraPaths = [
  "scenarios/architecture-docs/scripts",
  "scenarios/architecture-docs/backend/src",
  "scenarios/architecture-docs/toolkit-mcp",
]
exclude = ["**/.terraform", "out", "**/__pycache__"]

[tool.ruff]
target-version = "py311"
line-length = 100
